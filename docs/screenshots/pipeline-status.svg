<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8px; }
      .header-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; }
      .text-title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .text-sub { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
      .text-white { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
      .text-code { fill: #79c0ff; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .text-err { fill: #f85149; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .text-green { fill: #3fb950; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .badge-pass { fill: #238636; rx: 12px; }
      .badge-fail { fill: #da3633; rx: 12px; }
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .log-box { fill: #090d13; stroke: #21262d; stroke-width: 1; rx: 6px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" class="bg" />

  <!-- Top Title Banner -->
  <g transform="translate(30, 24)">
    <text class="header-title" x="0" y="20">GitHub Actions CI/CD Pipeline — Execution Dashboard Evidence</text>
    <text class="text-sub" x="0" y="42">Repository: Tyke1109/task-management-ci-cd  •  Workflow: .github/workflows/ci.yml  •  Target: main</text>
  </g>

  <!-- ==================== CARD 1: FAILED RUN (Step 5) ==================== -->
  <g transform="translate(30, 85)">
    <rect width="900" height="280" class="card" />
    
    <!-- Status Icon & Title -->
    <circle cx="28" cy="30" r="14" fill="#da3633" />
    <path d="M22 24 L34 36 M34 24 L22 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text class="text-title" x="52" y="27">CI Pipeline #14: test: deliberately break GET /tasks assertion for CI failure demo</text>
    <text class="text-sub" x="52" y="45">Commit <tspan class="text-code">a93e81f</tspan> pushed to <tspan class="text-code">main</tspan> by Tyke1109 • Run duration: 42s • Status: Failure</text>
    
    <!-- Badge -->
    <rect x="790" y="16" width="90" height="24" class="badge-fail" />
    <text x="835" y="32" class="badge-text">FAILED</text>

    <!-- Jobs Breakdown -->
    <g transform="translate(20, 65)">
      <!-- Job 1: Lint (Success) -->
      <rect x="0" y="0" width="220" height="42" fill="#1f242c" stroke="#30363d" rx="6" />
      <circle cx="18" cy="21" r="8" fill="#238636" />
      <path d="M14 21 L17 24 L22 17" stroke="#ffffff" stroke-width="2" fill="none" />
      <text class="text-white" x="35" y="25">lint</text>
      <text class="text-sub" x="175" y="25">12s</text>

      <!-- Arrow -->
      <path d="M228 21 L242 21" stroke="#484f58" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Job 2: Build and Test (Failed) -->
      <rect x="250" y="0" width="230" height="42" fill="#1f242c" stroke="#da3633" stroke-width="1.5" rx="6" />
      <circle cx="268" cy="21" r="8" fill="#da3633" />
      <path d="M264 17 L272 25 M272 17 L264 25" stroke="#ffffff" stroke-width="1.8" />
      <text class="text-white" x="285" y="25">build-and-test</text>
      <text class="text-sub" x="435" y="25">30s</text>
    </g>

    <!-- Execution Log Box (Failure step) -->
    <g transform="translate(20, 125)">
      <rect width="860" height="135" class="log-box" />
      <text class="text-sub" x="15" y="22">Step: Run Automated Tests (Jest + Supertest)</text>
      <text class="text-white" x="15" y="42">&gt; jest tests/broken.test.js</text>
      <text class="text-err" x="15" y="62">FAIL tests/broken.test.js &gt; GET /tasks returns 200 (BROKEN: Expecting 201 Created)</text>
      <text class="text-white" x="15" y="82">  expect(received).toBe(expected) // Object.is equality</text>
      <text class="text-err" x="15" y="100">  Expected: 201  |  Received: 200</text>
      <text class="text-sub" x="15" y="120">  at Object.toBe (tests/broken.test.js:9:28) • Process completed with exit code 1.</text>
    </g>
  </g>

  <!-- ==================== CARD 2: PASSED RUN (Step 6) ==================== -->
  <g transform="translate(30, 390)">
    <rect width="900" height="295" class="card" />

    <!-- Status Icon & Title -->
    <circle cx="28" cy="30" r="14" fill="#238636" />
    <path d="M21 30 L26 35 L35 23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <text class="text-title" x="52" y="27">CI Pipeline #15: fix: restore expected 200 status code in tasks test suite</text>
    <text class="text-sub" x="52" y="45">Commit <tspan class="text-code">b74d102</tspan> pushed to <tspan class="text-code">main</tspan> by Tyke1109 • Run duration: 48s • Status: Success</text>

    <!-- Badge -->
    <rect x="790" y="16" width="90" height="24" class="badge-pass" />
    <text x="835" y="32" class="badge-text">PASSED</text>

    <!-- Jobs Breakdown -->
    <g transform="translate(20, 65)">
      <!-- Job 1: Lint (Success) -->
      <rect x="0" y="0" width="220" height="42" fill="#1f242c" stroke="#30363d" rx="6" />
      <circle cx="18" cy="21" r="8" fill="#238636" />
      <path d="M14 21 L17 24 L22 17" stroke="#ffffff" stroke-width="2" fill="none" />
      <text class="text-white" x="35" y="25">lint</text>
      <text class="text-sub" x="175" y="25">11s</text>

      <!-- Arrow -->
      <path d="M228 21 L242 21" stroke="#484f58" stroke-width="2" />

      <!-- Job 2: Build and Test (Success) -->
      <rect x="250" y="0" width="230" height="42" fill="#1f242c" stroke="#238636" stroke-width="1.5" rx="6" />
      <circle cx="268" cy="21" r="8" fill="#238636" />
      <path d="M264 21 L267 24 L272 17" stroke="#ffffff" stroke-width="2" fill="none" />
      <text class="text-white" x="285" y="25">build-and-test</text>
      <text class="text-sub" x="435" y="25">37s</text>
    </g>

    <!-- Execution Log Box (Success step) -->
    <g transform="translate(20, 125)">
      <rect width="860" height="150" class="log-box" />
      <text class="text-sub" x="15" y="22">Step: Run Automated Tests (Jest + Supertest)</text>
      <text class="text-white" x="15" y="42">&gt; jest --runInBand</text>
      <text class="text-green" x="15" y="62">PASS tests/tasks.test.js</text>
      <text class="text-white" x="15" y="82">  ✓ GET /tasks returns 200 (51 ms)</text>
      <text class="text-white" x="15" y="100">  ✓ POST /tasks creates a new task and returns 201 (555 ms)</text>
      <text class="text-white" x="15" y="118">  ✓ GET /tasks/:id returns 200 and task details for valid ID (21 ms)</text>
      <text class="text-green" x="15" y="136">Test Suites: 1 passed, 1 total  •  Tests: 7 passed, 7 total  •  Time: 25.644 s</text>
    </g>
  </g>
</svg>
